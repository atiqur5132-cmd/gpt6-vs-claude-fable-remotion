name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition to render'
        required: true
        default: 'GoogleRSIDocumentary'
        type: choice
        options:
          - GoogleRSIDocumentary
          - LongFormDocumentary
          - DailyVideo
          - Video
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Render Full MP4 Video
        run: npx remotion render ${{ inputs.composition || 'GoogleRSIDocumentary' }} out/google_dream_rsi_documentary_2026.mp4 --concurrency=4

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: google-dream-rsi-documentary
          path: out/google_dream_rsi_documentary_2026.mp4
